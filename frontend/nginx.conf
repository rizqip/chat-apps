server {
    listen 80;
    server_name tamago.web.id www.tamago.web.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name tamago.web.id www.tamago.web.id;

    ssl_certificate /etc/letsencrypt/live/tamago.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tamago.web.id/privkey.pem;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    location /cable {
        proxy_pass http://web:3000/cable;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    location /api {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
    }
}
