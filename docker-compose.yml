version: "3.8"

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: strongpassword
      POSTGRES_DB: tamago_production
    volumes:
      - ./data/db:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: always
    volumes:
      - ./data/redis:/data

  web:
    build: ./backend
    command: bash -c "bundle exec rails db:migrate && bundle exec puma -C config/puma.rb"
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgres://appuser:strongpassword@db/tamago_production
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY_BASE: your_secret_key_here
    depends_on:
      - db
      - redis

  frontend:
    build: ./frontend
    # REMOVE command line karena sudah ada di Dockerfile
    depends_on:
      - web

  nginx:
    image: nginx:alpine
    depends_on:
      - web
      - frontend
    ports:
      - "80:80"
      # - "443:443"  # COMMENT DULU
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./frontend/build:/usr/share/nginx/html
      # - ./certbot/conf:/etc/letsencrypt  # COMMENT DULU
      # - ./certbot/www:/var/www/certbot   # COMMENT DULU

  # certbot:  # COMMENT DULU SERVICE CERTBOT
  #   image: certbot/certbot
  #   volumes:
  #     - ./certbot/conf:/etc/letsencrypt
  #     - ./certbot/www:/var/www/certbot
